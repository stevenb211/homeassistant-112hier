# Controleert of de integratie voldoet aan wat HACS en Home Assistant verwachten.
name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      # v5 draait op Node 24; v4 gaf een waarschuwing dat Node 20 verouderd is.
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
